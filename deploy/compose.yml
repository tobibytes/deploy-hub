# The whole of Rig on one host. Everything here is safe to run again: the API
# applies its own migrations and reconciles with Docker on every boot, so
# `docker compose up -d` is the only command needed for a first run or an update.
#
#   docker compose --env-file .env -f compose.yml up -d
#
# Two socket proxies, not one. Traefik only ever reads, and Rig can manage
# containers but nothing else. Neither holds /var/run/docker.sock, and a
# compromise of Traefik cannot create a container.
name: rig

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Everything both proxies refuse. Listed once so neither can quietly gain a
# permission the other has.
x-socket-denied: &socket-denied
  AUTH: 0
  BUILD: 0
  COMMIT: 0
  CONFIGS: 0
  DISTRIBUTION: 0
  EXEC: 0
  NODES: 0
  PLUGINS: 0
  SECRETS: 0
  SERVICES: 0
  SESSION: 0
  SWARM: 0
  SYSTEM: 0
  TASKS: 0

services:
  # Reads Docker labels and routes each hostname to the right container. This is
  # what makes an app's URL appear the moment Rig starts its container, and
  # disappear the moment it is deleted.
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    depends_on:
      docker-proxy-ro:
        condition: service_started
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --accesslog=true
      - --api.dashboard=false
      - --api.insecure=false
      - --ping=true
      # Per-router request counts, status codes, sizes and latency. Rig scrapes
      # these to show per-app traffic without putting anything in the apps.
      - --metrics.prometheus=true
      - --metrics.prometheus.addRoutersLabels=true
      - --metrics.prometheus.entryPoint=traefik
      - --entrypoints.web.address=:80
      # cloudflared is the only thing that reaches Traefik, so its forwarded
      # headers are the ones to believe. Without this the client address is
      # always cloudflared's own.
      - --entrypoints.web.forwardedHeaders.trustedIPs=172.16.0.0/12
      # Carries /ping and /metrics. Not published to the host and never routed
      # by cloudflared, so both are reachable from Rig and nowhere else.
      - --entrypoints.traefik.address=:8080
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-proxy-ro:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=rig_apps
    ports:
      # Handy on the local network. Cloudflare reaches Traefik over the tunnel,
      # not through this port, so closing it changes nothing about the public URLs.
      - "${TRAEFIK_HTTP_PORT:-8080}:80"
    networks:
      - edge
      - web
      - apps
      - socket-ro
    logging: *logging

  # Traefik's view of Docker: read only. It needs to list containers and
  # networks and to follow the event stream, and nothing else. POST is off, so
  # nothing reached through it can change anything.
  docker-proxy-ro:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      <<: *socket-denied
      CONTAINERS: 1
      NETWORKS: 1
      EVENTS: 1
      VERSION: 1
      PING: 1
      IMAGES: 0
      VOLUMES: 0
      INFO: 0
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-ro
    logging: *logging

  # Rig's view of Docker: enough to run apps, and no more. It can create, start,
  # stop and remove containers, pull images and make its network. It cannot exec
  # into anything, read secrets, or touch the swarm.
  docker-proxy-rw:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      <<: *socket-denied
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      EVENTS: 1
      INFO: 1
      VERSION: 1
      PING: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-rw
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rig}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rig}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rig} -d ${POSTGRES_DB:-rig}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - db
    logging: *logging

  rig:
    image: ${RIG_IMAGE:-ghcr.io/tobibytes/deploy-hub:latest}
    # Uncomment to build on the Pi instead of pulling a published image.
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy-rw:
        condition: service_started
    environment:
      NODE_ENV: production
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN in .env}
      RIG_HOSTNAME: ${RIG_HOSTNAME:-rig.${BASE_DOMAIN}}
      EXTRA_RESERVED_NAMES: ${EXTRA_RESERVED_NAMES:-}
      GUARDED_DOMAINS: ${GUARDED_DOMAINS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rig}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rig}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ENV_ENCRYPTION_KEY: ${ENV_ENCRYPTION_KEY:?set ENV_ENCRYPTION_KEY in .env}
      OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in .env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DOCKER_HOST_URL: http://docker-proxy-rw:2375
      APPS_NETWORK: rig_apps
      TRAEFIK_ENTRYPOINT: web
      TRAEFIK_PING_URL: http://traefik:8080/ping
      TRAEFIK_METRICS_URL: http://traefik:8080/metrics
      LOG_LEVEL: ${LOG_LEVEL:-info}
    labels:
      traefik.enable: "true"
      traefik.docker.network: rig_web
      traefik.http.routers.rig.rule: Host(`${RIG_HOSTNAME:-rig.${BASE_DOMAIN}}`)
      traefik.http.routers.rig.entrypoints: web
      traefik.http.routers.rig.service: rig
      traefik.http.services.rig.loadbalancer.server.port: "3001"
    networks:
      - web
      - socket-rw
      - db
    logging: *logging

  # Outbound-only connection to Cloudflare, so the home network needs no open
  # ports and no port forwarding.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_started
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - edge
    logging: *logging

networks:
  # Apps live here, and Traefik is the only other thing on it. They cannot reach
  # Postgres, the Docker proxies or the Rig API.
  apps:
    name: rig_apps
    driver: bridge
    attachable: true
  # Traefik to the Rig container, for the dashboard's own route.
  web:
    name: rig_web
    driver: bridge
  # Cloudflared to Traefik.
  edge:
    name: rig_edge
    driver: bridge
  # The three below are internal, so nothing on them reaches the internet and
  # nothing outside them reaches the Docker API or the database.
  socket-ro:
    name: rig_socket_ro
    driver: bridge
    internal: true
  socket-rw:
    name: rig_socket_rw
    driver: bridge
    internal: true
  db:
    name: rig_db
    driver: bridge
    internal: true

volumes:
  postgres-data:
    name: rig_postgres_data
